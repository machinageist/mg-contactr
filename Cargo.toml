[package]
name = "mg-contacts"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first contacts foundation with explicit privacy state"
license = "MIT"

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
toml = "0.9"
url = "2"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
